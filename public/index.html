    async function load() {
      loadModeSwitchAck();
      const [firstSig, res] = await Promise.all([
        fetch('/api/sig').then(r => r.json()).catch(() => null),
        fetch('/api/review').then(r => r.json()).catch(() => null),
        loadMode()
      ]);
      if (firstSig && firstSig.sig) setSig(firstSig.sig);
      model = res;
      const main = document.getElementById('main');
      if (!model || model.error) { if (main) main.innerHTML = '<div class="empty">' + esc(model?.error || 'No changes to review.') + '</div>'; startPolling(); return; }
      if (!model.files.length) { if (main) main.innerHTML = '<div class="empty">No changes to review.</div>'; startPolling(); return; }
      applyReview(model);
      startPolling();
    }

    function splitPath(filePath) {
      const idx = filePath.lastIndexOf('/');
      return idx === -1 ? { name: filePath, dir: '' } : { name: filePath.slice(idx + 1), dir: filePath.slice(0, idx) };
    }

    function makeResizeHandle() {
      const handle = el('div', 'resize-handle');
      const dots = el('div', 'rh-dots');
      dots.append(el('span', ''), el('span', ''), el('span', ''));
      handle.appendChild(dots);
      handle.addEventListener('mousedown', e => {
        e.preventDefault();
        const sidebar = handle.closest('.layout').querySelector('.sidebar');
        const startX = e.clientX, startW = sidebar.getBoundingClientRect().width;
        handle.classList.add('dragging');
        document.body.style.cssText += ';cursor:col-resize!important;user-select:none!important';
        const onMove = e => {
          const w = Math.max(180, Math.min(600, startW + e.clientX - startX));
          sidebar.style.width = w + 'px';
          sidebarW = w;
        };
        const onUp = () => {
          handle.classList.remove('dragging');
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
      return handle;
    }

    let showingCompletion = false;

    function isAllViewed() {
      return model && model.files && model.files.length > 0 && model.files.every(f => viewedFiles.has(f.filePath));
    }

    function buildCompletionView() {
      const detail = el('div', 'detail completion-wrap');
      const overlay = el('div', 'completion-overlay');
      overlay.innerHTML = '<h2 class="completion-title-floating">You made it to the end!</h2>';
      detail.appendChild(overlay);
      return detail;
    }

    function renderAll() {
      const main = document.getElementById('main');
      const oldSidebar = main.querySelector('.sidebar');
      const oldScroll = oldSidebar ? (oldSidebar.querySelector('.sfile-list')?.scrollTop || 0) : 0;
      main.innerHTML = '';
      main.appendChild(buildStats());
      const layout = el('div', 'layout');
      const newSidebar = buildSidebar();
      layout.appendChild(newSidebar);
      if (oldScroll) {
        const list = newSidebar.querySelector('.sfile-list');
        if (list) list.scrollTop = oldScroll;
      }
      layout.appendChild(makeResizeHandle());
      const useCompletion = showingCompletion && isAllViewed();
      const detailPane = useCompletion
        ? buildCompletionView()
        : buildDetail(model.files[currentFileIndex]);
      layout.appendChild(detailPane);
      main.appendChild(layout);
      if (!useCompletion) {
        for (const h of model.files[currentFileIndex].hunks) paintHunk(h);
      }
      tally();
    }

    function buildStats() {
      const wrap = el('div', 'stats');
      let changes = 0, kept = 0, partial = 0, restored = 0;
      for (const f of model.files) for (const h of f.hunks) {
        changes++;
        const s = lineRej[h.id].size, total = changedIdx[h.id].length;
        if (s === total && total > 0) restored++;
        else if (s === 0) kept++;
        else partial++;
      }
      const tiles = [
        ['files', ICON_FILE, model.files.length, 'Files'],
        ['changes', ICON_CHANGES, changes, 'Changes'],
        ['kept', ICON_BOOKMARK, kept, 'Kept'],
        ['partial', ICON_PARTIAL, partial, 'Partial'],
        ['restored', ICON_RESTORE, restored, 'Restored'],
      ];
      for (const [cls, icon, num, lbl] of tiles) {
        const tile = el('div', 'stat ' + cls);
        tile.innerHTML = '<div><div class="num">' + num + '</div><div class="lbl">' + lbl + '</div></div>'
          + '<div class="badge">' + icon + '</div>';
        wrap.appendChild(tile);
      }
      return wrap;
    }

    // Derive a file's overall status from its hunks: a file is 'kept' when nothing is
    // restored, 'restored' when every change is restored, else 'partial' (mixed).
    function getFileStatus(f) {
      let anyRej = false, allRej = true;
      for (const h of f.hunks) {
        const s = lineRej[h.id].size, total = changedIdx[h.id].length;
        if (s > 0) anyRej = true;
        if (!(s === total && total > 0)) allRej = false;
      }
      if (!anyRej) return 'kept';
      if (allRej) return 'restored';
      return 'partial';
    }

    // Whether a file passes the current search text AND the active status filter.
    function fileMatches(f) {
      const q = fileSearch.trim().toLowerCase();
      if (q && !f.filePath.toLowerCase().includes(q)) return false;
      switch (fileFilter) {
        case 'viewed': return viewedFiles.has(f.filePath);
        case 'unviewed': return !viewedFiles.has(f.filePath);
        case 'kept':
          return f.hunks.some(function (h) {
            const s = lineRej[h.id] ? lineRej[h.id].size : 0;
            const total = changedIdx[h.id] ? changedIdx[h.id].length : 0;
            return s < total;
          });
        case 'restored':
          return f.hunks.some(function (h) {
            const s = lineRej[h.id] ? lineRej[h.id].size : 0;
            const total = changedIdx[h.id] ? changedIdx[h.id].length : 0;
            return s === total && total > 0;
          });
        case 'partial':
          return getFileStatus(f) === 'partial';
        default: return true; // 'all'
      }
    }

    const FILTER_OPTS = [
      ['all', 'All'], ['kept', 'Kept'], ['partial', 'Partial'], ['restored', 'Restored'],
      ['viewed', 'Viewed'], ['unviewed', 'Unviewed'],
    ];

    // Rebuild only file rows; rebuilding the header would blur the search input.
    function renderFileList(sidebar) {
      const list = sidebar.querySelector('.sfile-list');
      const matches = model.files.map((f, i) => [f, i]).filter(([f]) => fileMatches(f));
      list.innerHTML = '';
      const count = sidebar.querySelector('.sfile-count');
      if (count) count.textContent = matches.length;

      if (matches.length === 0) {
        const empty = el('div', 'sfile-empty');
        empty.textContent = 'No files match';
        list.appendChild(empty);
        return;
      }

      for (const [f, i] of matches) {
        const { name, dir } = splitPath(f.filePath);
        const row = el('div', 'sfile' + (i === currentFileIndex ? ' current' : ''));
        const isViewed = viewedFiles.has(f.filePath);
        row.innerHTML = '<span class="sfile-icon ' + (isViewed ? 'viewed' : 'pending') + '">' + (isViewed ? ICON_CHECK_SM : '') + '</span>'
          + '<span class="sfile-info"><div class="sfile-name">' + esc(name) + '</div>'
          + (dir ? '<div class="sfile-dir">' + esc(dir) + '</div>' : '') + '</span>';
        row.onclick = () => goToFile(i);
        list.appendChild(row);
      }
    }

    function buildSidebar() {
      const aside = el('div', 'sidebar');
      if (sidebarW !== null) aside.style.width = sidebarW + 'px';

      const head = el('div', 'sidebar-head');
      const filterItems = FILTER_OPTS.map(function (opt) {
        return '<div class="filter-dd-item" role="option" data-value="' + opt[0] + '" tabindex="0">'
          + '<span class="fdi-check">' + ICON_CHECK_SM + '</span>'
          + '<span class="fdi-label">' + opt[1] + '</span></div>';
      }).join('');
      head.innerHTML = '<div class="sidebar-project" title="Active Project Folder">'
        + '<svg class="project-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>'
        + '<span class="project-name">__CR_PROJECT__</span></div>'
        + '<div class="sidebar-section-divider"></div>'
        + '<div class="sidebar-files-header">'
        + '<div class="sf-title">Files (<span class="sfile-count"></span>)</div>'
        + '<div class="sf-tools">'
        + '<div class="sf-search"><span class="sf-search-icon">' + ICON_SEARCH + '</span>'
        + '<input type="text" placeholder="Search files... (Ctrl+K)" aria-label="Search files">'
        + '<button class="sf-clear" aria-label="Clear search" title="Clear search" hidden>' + ICON_X + '</button></div>'
        + '<div class="filter-dd">'
        + '<button class="filter-dd-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Filter files" title="Filter files">' + ICON_FUNNEL + '</button>'
        + '<div class="filter-dd-menu" role="listbox" aria-label="Filter files">' + filterItems + '</div>'
        + '</div>'
        + '</div>'
        + '</div>';
      aside.appendChild(head);

      const list = el('div', 'sfile-list');
      aside.appendChild(list);

      // Seed value from state so it survives sidebar rebuilds without blurring.
      const search = head.querySelector('.sf-search input');
      const clearBtn = head.querySelector('.sf-clear');
      search.value = fileSearch;
      clearBtn.hidden = !fileSearch.trim();
      search.oninput = () => {
        fileSearch = search.value;
        clearBtn.hidden = !fileSearch.trim();
        renderFileList(aside);
      };
      clearBtn.onclick = () => {
        fileSearch = '';
        search.value = '';
        clearBtn.hidden = true;
        renderFileList(aside);
        search.focus();
      };

      const dd = head.querySelector('.filter-dd');
      const ddBtn = head.querySelector('.filter-dd-btn');
      const ddMenu = head.querySelector('.filter-dd-menu');
      ddBtn.classList.toggle('active', fileFilter !== 'all');
      for (const item of ddMenu.querySelectorAll('.filter-dd-item')) {
        item.classList.toggle('selected', item.dataset.value === fileFilter);
        item.setAttribute('aria-selected', String(item.dataset.value === fileFilter));
        item.onclick = () => {
          fileFilter = item.dataset.value;
          for (const it of ddMenu.querySelectorAll('.filter-dd-item')) {
            it.classList.toggle('selected', it === item);
            it.setAttribute('aria-selected', String(it === item));
          }
          ddBtn.classList.toggle('active', fileFilter !== 'all');
          ddMenu.classList.remove('open');
          ddBtn.setAttribute('aria-expanded', 'false');
          renderFileList(aside);
        };
      }
      ddBtn.onclick = () => {
        const open = ddMenu.classList.toggle('open');
        ddBtn.setAttribute('aria-expanded', String(open));
      };
      dd._closeMenu = () => { ddMenu.classList.remove('open'); ddBtn.setAttribute('aria-expanded', 'false'); };

      renderFileList(aside);
      return aside;
    }

    function goToFile(index) {
      const isCompletionVisible = showingCompletion;
      showingCompletion = false;
      if (index < 0 || index >= model.files.length) return;
      if (index === currentFileIndex && !isCompletionVisible) return;
      currentFileIndex = index;
      const main = document.getElementById('main');
      const oldDetail = main.querySelector('.detail');
      let rebuilt = false;
      const rebuild = () => {
        if (rebuilt) return; // animationend and 250ms fallback — whichever fires first
        rebuilt = true;
        const layout = main.querySelector('.layout');
        const newDetail = buildDetail(model.files[currentFileIndex]);
        newDetail.classList.add('slide-in');
        if (oldDetail) layout.replaceChild(newDetail, oldDetail); else layout.appendChild(newDetail);
        for (const h of model.files[currentFileIndex].hunks) paintHunk(h);
        // Rebuild sidebar to update "current" highlight.
        const oldSidebar = layout.querySelector('.sidebar');
        const oldScroll = oldSidebar ? (oldSidebar.querySelector('.sfile-list')?.scrollTop || 0) : 0;
        const newSidebar = buildSidebar();
        layout.replaceChild(newSidebar, oldSidebar);
        const list = newSidebar.querySelector('.sfile-list');
        if (list && oldScroll) list.scrollTop = oldScroll;
        // Scroll the selected row into view within the sidebar list.
        const cur = newSidebar.querySelector('.sfile.current');
        if (cur) cur.scrollIntoView({ block: 'nearest' });
      };
      if (oldDetail) {
        oldDetail.classList.add('slide-out');
        oldDetail.addEventListener('animationend', rebuild, { once: true });
        // Fallback if animationend never fires (reduced-motion, env quirks).
        setTimeout(rebuild, 250);
      } else {
        rebuild();
      }
    }

    function buildDetail(f) {
      const detail = el('div', 'detail');
      const { name, dir } = splitPath(f.filePath);
      const head = el('div', 'dhead');
      head.innerHTML = '<span class="ficon">' + ICON_FILE + '</span>'
        + '<span class="fmeta"><div class="fname">' + esc(name) + '</div>'
        + (dir ? '<div class="fdir">' + esc(dir) + '</div>' : '') + '</span>'
        + '<button type="button" class="copy-path-btn" aria-label="Copy file path" title="Copy file path">'
        + ICON_COPY + '</button>';
      head.querySelector('.copy-path-btn').onclick = (e) => copyFilePath(f.filePath, e.currentTarget);
      detail.appendChild(head);

      const dstats = el('div', 'dstats');
      dstats.innerHTML = '<span class="plus">+' + f.additions + '</span>'
        + '<span class="minus">\u2212' + f.deletions + '</span>'
        + '<span class="fileacts"><button class="btn-keep" data-f="acc">' + ICON_BOOKMARK_SM + 'Keep</button>'
        + '<button class="btn-restore" data-f="rej">' + ICON_RESTORE_SM + 'Restore</button>'
        + '<label class="viewed-toggle"><input type="checkbox" data-f="viewed"' + (viewedFiles.has(f.filePath) ? ' checked' : '') + '> Viewed</label></span>';
      dstats.querySelector('[data-f="acc"]').onclick = (e) => { pulseBtn(e.currentTarget, 'keep'); for (const h of f.hunks) setHunk(h, false); };
      dstats.querySelector('[data-f="rej"]').onclick = (e) => { pulseBtn(e.currentTarget, 'restore'); for (const h of f.hunks) setHunk(h, true); };
      dstats.querySelector('[data-f="viewed"]').onchange = (e) => {
        if (e.target.checked) markViewed(f);
        else { viewedFiles.delete(f.filePath); showingCompletion = false; saveViewedFiles(); renderAll(); } // unchecking is a correction — stay put, don't navigate away
      };
      detail.appendChild(dstats);

      let hunkNum = 0;
      for (const h of f.hunks) {
        hunkNum++;
        const hunkEl = el('div', 'hunk' + (collapsedHunks.has(h.id) ? ' collapsed' : ''));
        hunkEl.id = h.id;
        const bar = el('div', 'hunkbar');
        const showHunkActs = f.hunks.length > 1; // single-hunk files: file-level buttons already cover it
        bar.innerHTML = '<span class="hunk-toggle" role="button" tabindex="0" aria-label="Collapse hunk">'
          + '<span class="hunk-chev">' + ICON_CHEV + '</span>'
          + '<span class="hunk-title">Hunk ' + hunkNum + '</span>'
          + '<span class="hunk-range">' + hunkRangeLabel(h) + '</span>'
          + '<span class="st"></span></span>'
          + (showHunkActs
            ? '<span class="acts"><button class="btn-keep" data-a="acc">' + ICON_BOOKMARK_SM + 'Keep</button>'
            + '<button class="btn-restore" data-a="rej">' + ICON_RESTORE_SM + 'Restore</button></span>'
            : '');
        bar.querySelector('.hunk-toggle').onclick = () => toggleHunkCollapse(h);
        if (showHunkActs) {
          bar.querySelector('[data-a="acc"]').onclick = (e) => { pulseBtn(e.currentTarget, 'keep'); setHunk(h, false); };
          bar.querySelector('[data-a="rej"]').onclick = (e) => { pulseBtn(e.currentTarget, 'restore'); setHunk(h, true); };
        }
        hunkEl.appendChild(bar);

        const pre = el('pre');
        let oldLn = h.oldStart != null ? h.oldStart : 1;
        let newLn = h.newStart != null ? h.newStart : 1;
        let i = 0;
        while (i < h.lines.length) {
          const l = h.lines[i];
          const changed = (l[0] === '+' || l[0] === '-') && !l.startsWith('\\');
          if (!changed) {
            pre.appendChild(lineSpan(h, i, false, oldLn, newLn));
            if (!l.startsWith('\\')) { oldLn++; newLn++; }
            i++;
            continue;
          }
          const seg = el('div', 'seg');
          const segIdx = [];
          while (i < h.lines.length && (h.lines[i][0] === '+' || h.lines[i][0] === '-' || h.lines[i].startsWith('\\'))) {
            if (!h.lines[i].startsWith('\\')) {
              const isAdd = h.lines[i][0] === '+';
              seg.appendChild(lineSpan(h, i, true, isAdd ? null : oldLn, isAdd ? newLn : null));
              segIdx.push(i);
              if (isAdd) newLn++; else oldLn++;
            }
            i++;
          }
          const segbar = el('div', 'segbar');
          const keep = el('button', 'btn-keep'); keep.innerHTML = ICON_BOOKMARK_SM + 'Keep';
          const rev = el('button', 'btn-restore'); rev.innerHTML = ICON_RESTORE_SM + 'Restore';
          keep.onclick = (e) => {
            e.stopPropagation();
            const before = rejSnapshot(h);
            segIdx.forEach(x => lineRej[h.id].delete(x));
            paintHunk(h); tally();
            if (rejSnapshot(h) === before) pulseHunk(h, 'keep');
          };
          rev.onclick = (e) => {
            e.stopPropagation();
            const before = rejSnapshot(h);
            segIdx.forEach(x => lineRej[h.id].add(x));
            paintHunk(h); tally();
            if (rejSnapshot(h) === before) pulseHunk(h, 'restore');
          };
          segbar.appendChild(keep); segbar.appendChild(rev);
          seg.appendChild(segbar);
          pre.appendChild(seg);
        }
        hunkEl.appendChild(pre);

        const reason = el('div', 'reason');
        reason.style.display = 'none';
        renderReasonBox(h, reason);
        hunkEl.appendChild(reason);

        detail.appendChild(hunkEl);
      }
      return detail;
    }

    // Human-readable alternative to raw "@@ -a,b +c,d @@" unified-diff syntax.
    function hunkRangeLabel(h) {
      const start = h.newStart != null ? h.newStart : 1;
      const span = Math.max(h.additions || 0, h.deletions || 0, 1);
      return 'Lines ' + start + '\u2013' + (start + span - 1);
    }

    function markViewed(f) {
      viewedFiles.add(f.filePath);
      saveViewedFiles();
      // Advance to next unviewed file, wrapping around so out-of-order review still lands on unread files.
      for (let step = 1; step <= model.files.length; step++) {
        const idx = (currentFileIndex + step) % model.files.length;
        if (!viewedFiles.has(model.files[idx].filePath)) { goToFile(idx); return; }
      }
      showingCompletion = true;
      toast('🎉 All files reviewed! Ready to apply.');
      renderAll(); // everything is viewed — show completion screen and celebratory toast
    }

    function rejSnapshot(h) {
      return [...lineRej[h.id]].sort((a, b) => a - b).join(',');
    }

    function toggleLine(h, i) {
      const before = rejSnapshot(h);
      const s = lineRej[h.id];
      s.has(i) ? s.delete(i) : s.add(i);
      paintHunk(h); tally();
      if (rejSnapshot(h) === before) pulseHunk(h);
    }

    function setHunk(h, restoreAll) {
      const before = rejSnapshot(h);
      lineRej[h.id] = restoreAll ? new Set(changedIdx[h.id]) : new Set();
      paintHunk(h); tally();
      if (rejSnapshot(h) === before) pulseHunk(h, restoreAll ? 'restore' : 'keep');
    }

    function toggleHunkCollapse(h) {
      if (collapsedHunks.has(h.id)) collapsedHunks.delete(h.id);
      else collapsedHunks.add(h.id);
      const hunkEl = document.getElementById(h.id);
      if (hunkEl) hunkEl.classList.toggle('collapsed', collapsedHunks.has(h.id));
    }

    // Pulse only on no-ops; genuine transitions already have color-change feedback.
    function pulseHunk(h, type) {
      const el = document.getElementById(h.id);
      if (!el) return;
      el.classList.remove('pulse', 'pulse-keep', 'pulse-restore', 'pulse-default');
      void el.offsetWidth; // force reflow to re-trigger the animation
      const cls = type === 'keep' ? 'pulse-keep' : type === 'restore' ? 'pulse-restore' : 'pulse-default';
      el.classList.add(cls);
      setTimeout(() => el.classList.remove('pulse', 'pulse-keep', 'pulse-restore', 'pulse-default'), 600);
    }

    function pulseBtn(btn, type) {
      if (!btn) return;
      btn.classList.remove('pulse-btn-keep', 'pulse-btn-restore');
      void btn.offsetWidth;
      btn.classList.add(type === 'restore' ? 'pulse-btn-restore' : 'pulse-btn-keep');
      setTimeout(() => btn.classList.remove('pulse-btn-keep', 'pulse-btn-restore'), 450);
    }

    function copyFilePath(filePath, btn) {
      const doneIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M20 6L9 17l-5-5"/></svg>';
      const showDone = () => {
        btn.classList.add('copied');
        btn.innerHTML = doneIcon;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = ICON_COPY;
        }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(filePath).then(showDone).catch(() => fallbackCopy(filePath, showDone));
      } else {
        fallbackCopy(filePath, showDone);
      }
    }

    function fallbackCopy(text, then) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (_) { }
      document.body.removeChild(ta);
      then();
    }

    // Two modes: editable input (default/after Edit) or read-only view with Edit/Delete after Enter.
    // Enter only confirms this field — never triggers Apply.
    function renderReasonBox(h, reasonDiv) {
      reasonDiv.innerHTML = '';
      if (reasonConfirmed[h.id] && reasons[h.id]) {
        const view = el('div', 'reason-view');
        const txt = el('span', 'txt');
        txt.textContent = reasons[h.id];
        txt.title = reasons[h.id];
        const editBtn = document.createElement('button');
        editBtn.innerHTML = ICON_EDIT_SM + 'Edit';
        editBtn.onclick = () => { reasonConfirmed[h.id] = false; saveState(); renderReasonBox(h, reasonDiv); };
        const delBtn = document.createElement('button');
        delBtn.innerHTML = ICON_TRASH_SM + 'Delete';
        delBtn.onclick = () => { reasons[h.id] = ''; reasonConfirmed[h.id] = false; saveState(); renderReasonBox(h, reasonDiv); };
        view.appendChild(txt); view.appendChild(editBtn); view.appendChild(delBtn);
        reasonDiv.appendChild(view);
      } else {
        const row = el('div', 'reason-row');
        const inp = document.createElement('input');
        inp.placeholder = 'Why? This goes back to Claude as feedback (optional)';
        inp.value = reasons[h.id] || '';
        const submitBtn = document.createElement('button');
        submitBtn.className = 'reason-submit';
        submitBtn.type = 'button';
        submitBtn.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
        submitBtn.title = 'Submit reason (or press Enter)';
        submitBtn.disabled = !inp.value.trim();

        // Shared confirm path for Enter key and button click.
        const confirm = () => {
          if (!inp.value.trim()) { inp.blur(); return; }
          reasonConfirmed[h.id] = true;
          saveState();
          renderReasonBox(h, reasonDiv);
        };

        inp.oninput = () => {
          reasons[h.id] = inp.value;
          submitBtn.disabled = !inp.value.trim();
          saveState();
        };
        inp.onkeydown = (e) => {
          if (e.key !== 'Enter') return;
          e.preventDefault(); // don't bubble into page-level Apply
          confirm();
        };
        submitBtn.onclick = confirm;

        row.appendChild(inp);
        row.appendChild(submitBtn);
        reasonDiv.appendChild(row);
      }
    }

    function paintHunk(h) {
      const hunkEl = document.getElementById(h.id);
      if (!hunkEl) return; // not in the current detail pane
      const s = lineRej[h.id], total = changedIdx[h.id].length;
      hunkEl.querySelectorAll('pre .l').forEach(sp => {
        if (sp.dataset.i === undefined) return;
        const flagged = s.has(+sp.dataset.i);
        // '+' rejected → struck through. '-' rejected → restoring (must look kept, not erased).
        sp.classList.toggle('rej', flagged && sp.classList.contains('a'));
        sp.classList.toggle('restoring', flagged && sp.classList.contains('d'));
      });
      const state = s.size === 0 ? 'kept' : s.size === total ? 'restored' : 'partial';
      hunkEl.className = 'hunk ' + state + (collapsedHunks.has(h.id) ? ' collapsed' : '');
      hunkEl.querySelector('.st').textContent =
        state === 'kept' ? '' : state === 'restored' ? 'restored' : s.size + ' of ' + total + ' lines restoring';
      const reasonDiv = hunkEl.querySelector('.reason');
      reasonDiv.style.display = s.size ? '' : 'none';
      if (s.size === 0 && (reasons[h.id] || reasonConfirmed[h.id])) {
        // Clear reason when keeping: prevents stale text from a prior rejection reaching Claude.
        reasons[h.id] = '';
        reasonConfirmed[h.id] = false;
        renderReasonBox(h, reasonDiv);
      }
    }

    function tally() {
      let total = 0, rej = 0, partial = 0;
      for (const id in changedIdx) {
        total++;
        const s = lineRej[id].size;
        if (s === changedIdx[id].length && s > 0) rej++;
        else if (s > 0) partial++;
      }
      saveState();
      const statsEl = document.querySelector('.stats');
      if (statsEl) { statsEl.replaceWith(buildStats()); }
      const sidebar = document.querySelector('.sidebar');
      if (sidebar) renderFileList(sidebar);
    }

    function showApplyConfirm() {
      const modeLabel = currentMode === 'accumulate' ? 'All Changes' : 'Last Prompt';
      const modeBadge = document.getElementById('confirmModeLabel');
      if (modeBadge) {
        modeBadge.innerHTML = 'Mode: <span class="confirm-mode-text">' + modeLabel + '</span>';
      }
      let totalFiles = model.files.length, kept = 0, partial = 0, restored = 0;
      for (const f of model.files) for (const h of f.hunks) {
        const s = lineRej[h.id].size, total = changedIdx[h.id].length;
        if (s === total && total > 0) restored++;
        else if (s === 0) kept++;
        else partial++;
      }
      const summary = document.getElementById('confirmSummary');
      summary.innerHTML =
        '<div class="cs-tile cs-files" data-filter="all" title="Click to view all files"><div class="cs-num">' + totalFiles + '</div><div class="cs-lbl">Files</div></div>' +
        '<div class="cs-tile cs-kept" data-filter="kept" title="Click to filter by kept files"><div class="cs-num">' + kept + '</div><div class="cs-lbl">Kept</div></div>' +
        '<div class="cs-tile cs-partial" data-filter="partial" title="Click to filter by partially kept files"><div class="cs-num">' + partial + '</div><div class="cs-lbl">Partial</div></div>' +
        '<div class="cs-tile cs-restored" data-filter="restored" title="Click to filter by restored files"><div class="cs-num">' + restored + '</div><div class="cs-lbl">Restored</div></div>';

      summary.querySelectorAll('.cs-tile').forEach(function (tile) {
        tile.onclick = function () {
          const filterType = tile.getAttribute('data-filter');
          fileFilter = filterType;
          closeConfirmModal();
          const matches = model.files.map((f, i) => [f, i]).filter(([f]) => fileMatches(f));
          if (matches.length > 0 && !matches.some(([, i]) => i === currentFileIndex)) {
            currentFileIndex = matches[0][1];
          }
          renderAll();
        };
      });

      const fileWord = totalFiles === 1 ? 'file' : 'files';
      let msg;
      if (restored === 0 && partial === 0) {
        msg = 'In <strong>' + modeLabel + '</strong> mode, all changes across <strong>' + totalFiles + ' ' + fileWord + '</strong> will be kept.';
      } else if (kept === 0 && partial === 0) {
        msg = 'In <strong>' + modeLabel + '</strong> mode, all <strong>' + restored + ' change' + (restored === 1 ? '' : 's') + '</strong> across <strong>' + totalFiles + ' ' + fileWord + '</strong> will be restored.';
      } else {
        const parts = [];
        if (kept > 0) parts.push('<strong>' + kept + ' change' + (kept === 1 ? '' : 's') + '</strong> kept');
        if (partial > 0) parts.push('<strong>' + partial + '</strong> partially restored');
        if (restored > 0) parts.push('<strong>' + restored + '</strong> fully restored');
        msg = 'In <strong>' + modeLabel + '</strong> mode: ' + parts.join(', ') + ' across <strong>' + totalFiles + ' ' + fileWord + '</strong>.';
      }
      document.getElementById('confirmMsg').innerHTML = msg;
      document.body.classList.add('modal-open');
      document.getElementById('confirmOverlay').classList.remove('hidden');
      document.getElementById('confirmOk').focus();
    }

    function closeConfirmModal() {
      document.body.classList.remove('modal-open');
      document.getElementById('confirmOverlay').classList.add('hidden');
    }

    async function submit() {
      document.getElementById('confirmOverlay').classList.add('hidden');
      if (pollTimer) clearInterval(pollTimer);
      const btn = document.getElementById('submit');
      btn.disabled = true; btn.textContent = 'Applying\u2026';
      const selections = {};
      let count = 0;
      for (const id in lineRej) {
        if (lineRej[id].size) { selections[id] = { lines: [...lineRej[id]] }; count++; }
      }
      const res = await fetch('/api/submit', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ selections, reasons })
      });
      const out = await res.json();
      clearState();
      const fails = (out.results || []).filter(r => !r.ok);
      btn.textContent = 'Applied ✓';
      document.getElementById('keepAll').style.display = 'none';
      document.getElementById('restoreAll').style.display = 'none';

      const successSvg = '<svg class="success-checkmark-svg" viewBox="0 0 52 52">'
        + '<circle cx="26" cy="26" r="25"/>'
        + '<path d="M14 27l7 7 16-16"/>'
        + '</svg>';

      document.getElementById('main').innerHTML = '<div class="apply-success-wrap">'
        + successSvg
        + '<h2 class="apply-success-title">Review Applied!</h2>'
        + '<p class="apply-success-sub">' + (fails.length ? 'Changes applied. Some files changed externally.' : 'All review selections saved successfully.') + '</p>'
        + '</div>';

      setTimeout(() => { window.close(); }, 1700);
    }

    function lineSpan(h, i, clickable, oldLn, newLn) {
      const l = h.lines[i];
      const cls = l[0] === '+' ? 'a' : l[0] === '-' ? 'd' : 'c';
      const span = el('span', 'l ' + cls);
      const gutter = el('span', 'gutter');
      gutter.innerHTML = '<span>' + (oldLn != null ? oldLn : '') + '</span><span>' + (newLn != null ? newLn : '') + '</span>';
      span.appendChild(gutter);
      const txt = el('span', 'txt');
      txt.textContent = l || ' ';
      span.appendChild(txt);
      if (clickable) {
        span.title = 'Click to restore just this line';
        span.onclick = () => toggleLine(h, i);
        span.dataset.i = i;
      }
      return span;
    }

    function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }
    function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

    let updateDone = false; // set after a successful in-session update so the banner stays as confirmation
    function updateBanner(available, latestVersion) {
      const banner = document.getElementById('update-banner');
      const msg = document.getElementById('update-msg');
      if (!banner) return;
      if (updateDone) return; // keep the "restart to apply" confirmation in place
      if (!available) { banner.classList.remove('visible'); return; }
      if (banner.classList.contains('visible')) return; // already shown, don't reset mid-update
      msg.innerHTML = '<strong>Review Tab v' + esc(latestVersion) + '</strong> is available.';
      banner.classList.add('visible');
    }

    document.getElementById('update-btn').onclick = async () => {
      const btn = document.getElementById('update-btn');
      const msg = document.getElementById('update-msg');
      btn.disabled = true;
      btn.textContent = 'Updating…';
      try {
        const res = await fetch('/api/update', { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Update failed');
        msg.innerHTML = '<strong>Updated to v' + esc(data.latestVersion) + '!</strong> Restart Claude Code to apply.';
        btn.style.display = 'none';
        updateDone = true;
      } catch (err) {
        msg.textContent = 'Update failed: ' + err.message;
        btn.disabled = false;
        btn.textContent = 'Retry';
      }
    };

    document.getElementById('keepAll').onclick = (e) => { pulseBtn(e.currentTarget, 'keep'); for (const f of model.files) for (const h of f.hunks) setHunk(h, false); };
    document.getElementById('restoreAll').onclick = (e) => { pulseBtn(e.currentTarget, 'restore'); for (const f of model.files) for (const h of f.hunks) setHunk(h, true); };
    document.getElementById('submit').onclick = showApplyConfirm;
    document.getElementById('confirmOk').onclick = submit;
    document.getElementById('confirmCancel').onclick = closeConfirmModal;
    document.getElementById('confirmOverlay').onclick = (e) => { if (e.target === e.currentTarget) closeConfirmModal(); };
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const modeSwitchOverlay = document.getElementById('modeSwitchOverlay');
        if (modeSwitchOverlay && !modeSwitchOverlay.classList.contains('hidden')) {
          document.getElementById('modeSwitchCancel').click();
        } else {
          closeConfirmModal();
        }
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        const search = document.querySelector('.sf-search input');
        if (search) { e.preventDefault(); search.focus(); search.select(); }
      }
    });
    load();
  </script>
</body>

</html>
